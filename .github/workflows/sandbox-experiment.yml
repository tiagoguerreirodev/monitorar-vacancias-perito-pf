{
  "name": "[DEBUG-uf-linux] Temporary reversible sandbox experiment (no Gov)",
  "on": {"workflow_dispatch": {}},
  "permissions": {"contents": "read"},
  "concurrency": {"group": "uf-linux-sandbox-experiment-main", "cancel-in-progress": false},
  "jobs": {
    "experiment": {
      "if": "${{ github.repository == 'tiagoguerreirodev/monitorar-vacancias-perito-pf' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {"uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", "with": {"ref": "${{ github.sha }}", "persist-credentials": false}},
        {"name": "Install same checksum-verified Python", "run": "bash .github/scripts/setup-python.sh"},
        {"name": "Offline safety checks first", "run": "python3 -m unittest discover -v"},
        {
          "name": "[DEBUG-uf-linux] One scoped A/B/A experiment only",
          "env": {"PERITO_RUNTIME_ROOT": "${{ runner.temp }}/perito-uf-runtime"},
          "run": "exec python3 .github/scripts/sandbox-experiment.py --output uf-sandbox-experiment.json"
        },
        {
          "name": "[DEBUG-uf-linux] Retain fixed-schema JSON only",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {"name": "uf-sandbox-experiment-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}", "path": "uf-sandbox-experiment.json", "if-no-files-found": "warn", "retention-days": 7}
        }
      ]
    }
  }
}
