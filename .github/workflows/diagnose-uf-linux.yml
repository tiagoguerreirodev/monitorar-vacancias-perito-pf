{
  "name": "[DEBUG-uf-linux] Diagnose blank Chrome startup (no Gov/no publication)",
  "on": {"workflow_dispatch": {}},
  "permissions": {"contents": "read"},
  "concurrency": {"group": "uf-linux-diagnosis-main", "cancel-in-progress": false},
  "jobs": {
    "diagnose": {
      "if": "${{ github.repository == 'tiagoguerreirodev/monitorar-vacancias-perito-pf' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {"uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", "with": {"ref": "${{ github.sha }}", "persist-credentials": false}},
        {"name": "Install same checksum-verified Python", "run": "bash .github/scripts/setup-python.sh"},
        {"name": "Validate offline boundaries", "run": "python3 -m unittest discover -v"},
        {
          "name": "[DEBUG-uf-linux] Observe three fresh blank startups only",
          "env": {"PERITO_RUNTIME_ROOT": "${{ runner.temp }}/perito-uf-runtime"},
          "run": "python3 .github/scripts/diagnose-uf-linux.py --output uf-linux-diagnosis.json"
        },
        {
          "name": "[DEBUG-uf-linux] Retain sanitized diagnostic JSON only",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {"name": "uf-linux-diagnosis-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}", "path": "uf-linux-diagnosis.json", "if-no-files-found": "error", "retention-days": 7}
        }
      ]
    }
  }
}
